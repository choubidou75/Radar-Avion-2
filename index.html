<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Aérien</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --amber: #ffb347;
  --amber-dim: rgba(255,179,71,0.15);
  --amber-mid: rgba(255,179,71,0.5);
  --red: #ff4d4d;
  --blue: #4dc8ff;
  --bg: #0a0800;
  --bg2: #110e01;
  --panel: #0e0b01;
  --border: rgba(255,179,71,0.18);
  --text: #f0d88a;
  --dim: #5a4e28;
  --dimmer: #2e2710;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Noise texture overlay */
body::after {
  content:'';
  position:fixed;inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:999;opacity:0.4;
}

/* ── HEADER ── */
.header {
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(255,179,71,0.04) 0%, transparent 100%);
  flex-shrink: 0;
}

.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.25rem;
  color: var(--amber);
  letter-spacing: 0.12em;
  white-space: nowrap;
  text-shadow: 0 0 20px rgba(255,179,71,0.4);
}
.logo span { color: var(--dim); font-weight: 400; font-size: 0.7rem; display: block; letter-spacing: 0.2em; margin-top: 1px; }

/* Address bar */
.addr-form {
  flex: 1;
  display: flex;
  gap: 8px;
  align-items: center;
}

.addr-input {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  color: var(--amber);
  font-family: 'DM Mono', monospace;
  font-size: 0.82rem;
  padding: 9px 14px;
  outline: none;
  letter-spacing: 0.04em;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.addr-input::placeholder { color: var(--dim); }
.addr-input:focus {
  border-color: var(--amber-mid);
  box-shadow: 0 0 0 1px rgba(255,179,71,0.1), 0 0 16px rgba(255,179,71,0.05);
}

.btn {
  background: none;
  border: 1px solid var(--amber-mid);
  color: var(--amber);
  font-family: 'Orbitron', sans-serif;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  padding: 9px 18px;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn:hover { background: var(--amber-dim); box-shadow: 0 0 12px rgba(255,179,71,0.15); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn.secondary { border-color: var(--border); color: var(--dim); font-size: 0.58rem; }
.btn.secondary:hover { color: var(--amber); border-color: var(--amber-mid); }

/* Status pills */
.pills { display: flex; gap: 10px; flex-shrink: 0; }
.pill {
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  padding: 4px 10px;
  border: 1px solid var(--border);
  color: var(--dim);
  white-space: nowrap;
}
.pill.on { border-color: rgba(77,200,255,0.3); color: var(--blue); }
.pill.warn { border-color: rgba(255,77,77,0.3); color: var(--red); }

/* ── MAIN LAYOUT ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 420px;
  overflow: hidden;
}

/* ── RADAR ── */
.radar-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(ellipse 60% 60% at 50% 50%, #120e00 0%, var(--bg) 100%);
}

canvas#radar { display: block; image-rendering: crisp-edges; }

.radar-corner {
  position: absolute;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.55rem;
  color: var(--dim);
  letter-spacing: 0.15em;
}
.radar-corner.tl { top: 16px; left: 20px; }
.radar-corner.tr { top: 16px; right: 20px; text-align: right; }
.radar-corner.bl { bottom: 16px; left: 20px; }

/* Splash screen */
.splash {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
}
.splash-icon { font-size: 3.5rem; opacity: 0.15; }
.splash-text { color: var(--dim); font-size: 0.78rem; letter-spacing: 0.12em; line-height: 2; }
.splash-text strong { color: var(--amber); opacity: 0.6; display: block; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; margin-bottom: 6px; }

/* ── RIGHT PANEL ── */
.panel {
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--panel);
  overflow: hidden;
}

.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-shrink: 0;
}
.panel-header .title {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--dim);
  text-transform: uppercase;
}
.panel-header .count {
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--amber);
  line-height: 1;
}

.ac-list {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.ac-list::-webkit-scrollbar { width: 3px; }
.ac-list::-webkit-scrollbar-thumb { background: var(--border); }

/* Aircraft card */
.ac-card {
  padding: 14px 18px;
  border-bottom: 1px solid var(--dimmer);
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
}
.ac-card::before {
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:2px;
  background:transparent;
  transition: background 0.15s, box-shadow 0.15s;
}
.ac-card:hover { background: rgba(255,179,71,0.03); }
.ac-card:hover::before { background: var(--amber-mid); }
.ac-card.selected { background: rgba(255,179,71,0.06); }
.ac-card.selected::before { background: var(--amber); box-shadow: 0 0 8px rgba(255,179,71,0.5); }

.ac-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 6px;
}
.ac-callsign {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--amber);
  letter-spacing: 0.08em;
}
.ac-type-badge {
  font-size: 0.55rem;
  padding: 2px 7px;
  letter-spacing: 0.14em;
  border: 1px solid;
  text-transform: uppercase;
  margin-top: 2px;
}
.ac-type-badge.commercial { border-color: rgba(77,200,255,0.4); color: var(--blue); }
.ac-type-badge.private { border-color: rgba(255,77,77,0.35); color: var(--red); }
.ac-type-badge.unknown { border-color: var(--border); color: var(--dim); }

.ac-route {
  font-size: 0.72rem;
  color: var(--text);
  letter-spacing: 0.04em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ac-route .airport { color: var(--amber); }
.ac-route .arrow { color: var(--dim); }
.ac-route .loading { color: var(--dim); font-style: italic; animation: blink 1s infinite; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

.ac-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.ac-field { }
.ac-field .lbl { font-size: 0.52rem; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; }
.ac-field .val { font-size: 0.68rem; color: var(--text); margin-top: 2px; }

.ac-dist-tag {
  position: absolute;
  right: 14px;
  top: 14px;
  font-size: 0.65rem;
  color: var(--dim);
}

/* Detail drawer */
.detail {
  border-top: 1px solid var(--border);
  background: rgba(255,179,71,0.03);
  padding: 0;
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease, padding 0.2s;
  flex-shrink: 0;
}
.detail.open { max-height: 320px; padding: 16px 18px; }

.detail-callsign {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 1.6rem;
  color: var(--amber);
  letter-spacing: 0.08em;
  text-shadow: 0 0 24px rgba(255,179,71,0.3);
  margin-bottom: 12px;
  line-height: 1;
}
.detail-model {
  font-size: 0.72rem;
  color: var(--text);
  margin-bottom: 14px;
  letter-spacing: 0.04em;
}
.detail-route-big {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.drt-airport {
  text-align: center;
}
.drt-airport .code { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--amber); }
.drt-airport .name { font-size: 0.55rem; color: var(--dim); letter-spacing: 0.1em; margin-top: 2px; max-width: 80px; }
.drt-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--amber-mid), var(--dim));
  position: relative;
}
.drt-line::after {
  content: '✈';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.75rem;
  color: var(--amber);
  background: var(--panel);
  padding: 0 4px;
}
.detail-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
.dr { font-size: 0.65rem; display: flex; justify-content: space-between; border-bottom: 1px solid var(--dimmer); padding-bottom: 4px; }
.dr .dk { color: var(--dim); }
.dr .dv { color: var(--text); }

/* Empty/loading states */
.empty {
  padding: 48px 20px;
  text-align: center;
  color: var(--dim);
  font-size: 0.72rem;
  line-height: 2.2;
  letter-spacing: 0.08em;
}

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spin {
  display: inline-block;
  width: 9px; height: 9px;
  border: 1px solid var(--border);
  border-top-color: var(--amber);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 5px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: rgba(10,8,0,0.97);
  border: 1px solid var(--amber-mid);
  color: var(--text);
  padding: 9px 20px;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  z-index: 2000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* Countdown bar */
.cdown-wrap {
  padding: 8px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  font-size: 0.6rem;
  color: var(--dim);
  letter-spacing: 0.12em;
}
.cdown-bar-bg {
  flex: 1;
  height: 2px;
  background: var(--dimmer);
  position: relative;
  overflow: hidden;
}
.cdown-bar {
  height: 100%;
  background: var(--amber);
  box-shadow: 0 0 6px rgba(255,179,71,0.5);
  transition: width 1s linear;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    SKYSCAN
    <span>RADAR AÉRIEN TEMPS RÉEL</span>
  </div>

  <div class="addr-form">
    <input class="addr-input" id="addr-input" type="text"
      placeholder="Entrez une adresse postale… ex: 10 rue de Rivoli, Paris"
      autocomplete="off"
      onkeydown="if(event.key==='Enter') geocodeAndSearch()"
    >
    <button class="btn" id="search-btn" onclick="geocodeAndSearch()">▶ Analyser</button>
    <button class="btn secondary" id="refresh-btn" onclick="manualRefresh()" disabled>↺</button>
  </div>

  <div class="pills">
    <div class="pill" id="pill-loc">—</div>
    <div class="pill" id="pill-api">EN ATTENTE</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- RADAR -->
  <div class="radar-wrap" id="radar-wrap">
    <div class="splash" id="splash">
      <div class="splash-icon">✈</div>
      <div class="splash-text">
        <strong>SKYSCAN RADAR</strong>
        Entrez une adresse pour démarrer la surveillance<br>
        Rayon de détection : 100 km
      </div>
    </div>
    <canvas id="radar" style="display:none;"></canvas>
    <div class="radar-corner tl" id="rc-tl"></div>
    <div class="radar-corner tr" id="rc-tr"></div>
    <div class="radar-corner bl" id="rc-bl">OPENSKY NETWORK · ADS-B</div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel">
    <div class="panel-header">
      <div class="title">Aéronefs détectés</div>
      <div class="count" id="ac-count">—</div>
    </div>
    <div class="ac-list" id="ac-list">
      <div class="empty">En attente d'une adresse…</div>
    </div>
    <div class="detail" id="detail"></div>
    <div class="cdown-wrap" id="cdown-wrap" style="display:none;">
      <span id="cdown-label">ACTUALISATION</span>
      <div class="cdown-bar-bg"><div class="cdown-bar" id="cdown-bar" style="width:100%"></div></div>
      <span id="cdown-sec">30s</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let myLat = null, myLon = null, myAddress = '';
let aircraft = [];
let selectedIcao = null;
let radarAngle = 0;
let rafId = null;
let countdownVal = 30;
let cdInterval = null;
let fetchTimeout = null;
const RADIUS_KM = 100;
// Cache for enriched data to avoid re-fetching
const enrichCache = {};

// ─────────────────────────────────────────────
//  GEOCODE ADDRESS → lat/lon (Nominatim)
// ─────────────────────────────────────────────
async function geocodeAndSearch() {
  const raw = document.getElementById('addr-input').value.trim();
  if (!raw) { showToast('Veuillez entrer une adresse'); return; }

  setPill('loc', 'loading', '⠿ GÉOCODAGE…');
  setPill('api', '', 'EN ATTENTE');
  document.getElementById('search-btn').disabled = true;

  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(raw)}&format=json&limit=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'fr' } });
    const data = await res.json();
    if (!data.length) throw new Error('Adresse introuvable');

    myLat = parseFloat(data[0].lat);
    myLon = parseFloat(data[0].lon);
    myAddress = data[0].display_name.split(',').slice(0, 3).join(',');

    setPill('loc', 'on', myAddress.substring(0, 28) + '…');
    document.getElementById('rc-tl').textContent = `LAT ${myLat.toFixed(4)}  LON ${myLon.toFixed(4)}`;
    document.getElementById('rc-tr').textContent = myAddress.split(',')[0].trim().toUpperCase();

    showRadar();
    startFetching();
  } catch(e) {
    setPill('loc', 'warn', 'ADRESSE INVALIDE');
    showToast('Adresse introuvable — essayez une formulation différente');
  }
  document.getElementById('search-btn').disabled = false;
}

// ─────────────────────────────────────────────
//  FETCH OPENSKY
// ─────────────────────────────────────────────
function deg2rad(d) { return d * Math.PI / 180; }

function distKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = deg2rad(lat2 - lat1), dLon = deg2rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lon1, lat2, lon2) {
  const dLon = deg2rad(lon2 - lon1);
  const y = Math.sin(dLon)*Math.cos(deg2rad(lat2));
  const x = Math.cos(deg2rad(lat1))*Math.sin(deg2rad(lat2)) - Math.sin(deg2rad(lat1))*Math.cos(deg2rad(lat2))*Math.cos(dLon);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}

async function fetchAircraft() {
  if (myLat === null) return;
  setPill('api', 'loading', '⠿ SCAN…');

  // Bounding box (≈ 1.5° ≈ 165 km each side for safety)
  const d = 1.3;
const url =`https://shrill-hat-9629.clmferreri.workers.dev/?lat=${myLat}&lon=${myLon}&radius=54`;  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
 const states = data.ac || [];

aircraft = states.map(s => ({
  icao24: s.hex || '',
  callsign: (s.flight || '').trim() || s.r || '—',
  country: s.desc || '—',
  lon: parseFloat(s.lon),
  lat: parseFloat(s.lat),
  altitude: s.alt_baro != null ? Math.round(s.alt_baro) : null,
  onGround: false,
  velocity: s.gs != null ? Math.round(s.gs * 1.852) : null,
  heading: parseFloat(s.track),
  vertRate: s.geom_rate != null ? s.geom_rate.toFixed(0) : null,

  model: s.t || null,
  registration: s.r || null,
  origin: null,
  destination: null,
  flightType: null,

  enriched: false,
  enrichLoading: false,
}))
    .filter(a =>
  Number.isFinite(a.lat) &&
  Number.isFinite(a.lon) &&
  !a.onGround
)
    .map(a => ({
      ...a,
      dist: distKm(myLat, myLon, a.lat, a.lon),
      brg: bearing(myLat, myLon, a.lat, a.lon),
    }))
    .filter(a => a.dist <= RADIUS_KM)
    .sort((a, b) => a.dist - b.dist);

    setPill('api', 'on', `${aircraft.length} AÉRONEFS`);
    document.getElementById('ac-count').textContent = aircraft.length;
    renderList();
    drawRadar();

    // Enrich top-20 (nearest first)
    aircraft.slice(0, 20).forEach(a => enrichAircraft(a));

  } catch(e) {
    setPill('api', 'warn', 'ERREUR RÉSEAU');
    showToast('Erreur OpenSky Network — nouvelle tentative dans 30s');
  }
}

// ─────────────────────────────────────────────
//  ENRICHMENT : model, route, type
// ─────────────────────────────────────────────

// Determine commercial vs private from callsign heuristics
function guessFlightType(callsign, country) {
  if (!callsign || callsign === '—') return 'unknown';
  // ICAO airline codes are 3 letters followed by digits
  if (/^[A-Z]{2,3}\d/.test(callsign)) return 'commercial';
  // N-number = US private/general aviation
  if (/^N\d/.test(callsign)) return 'private';
  // Pure hex or registration-like = private
  if (/^[A-Z]-/.test(callsign) || /^\d/.test(callsign)) return 'private';
  // Military callsigns
  if (/^(USAF|NATO|RRR|IAM|GAF|FAF|RAF)/.test(callsign)) return 'military';
  return 'unknown';
}

async function enrichAircraft(ac) {
  if (enrichCache[ac.icao24]) {
    Object.assign(ac, enrichCache[ac.icao24]);
    ac.enriched = true;
    renderList();
    if (selectedIcao === ac.icao24) renderDetail();
    return;
  }

  ac.enrichLoading = true;
  ac.flightType = guessFlightType(ac.callsign, ac.country);
  renderList();

  // Try ADS-B Exchange v2 (no key needed for basic data)
  const callsignClean = ac.callsign.replace(/\s/g,'');
  let origin = null, destination = null, model = null, flightType = ac.flightType;

  // Try to get route info from api.adsbdb.com (free, no key)
  if (callsignClean && callsignClean !== '—') {
    try {
      const rRes = await fetch(`https://api.adsbdb.com/v0/callsign/${callsignClean}`);
      if (rRes.ok) {
        const rData = await rRes.json();
        const route = rData?.response?.flightroute;
        if (route) {
          origin = route.origin ? {
            code: route.origin.iata_code || route.origin.icao_code || '?',
            name: route.origin.name || '',
            city: route.origin.municipality || '',
            country: route.origin.iso_country || '',
          } : null;
          destination = route.destination ? {
            code: route.destination.iata_code || route.destination.icao_code || '?',
            name: route.destination.name || '',
            city: route.destination.municipality || '',
            country: route.destination.iso_country || '',
          } : null;
          // Airline info helps confirm commercial
          if (route.airline) flightType = 'commercial';
          model = route.aircraft ? formatModel(route.aircraft) : null;
        }
      }
    } catch(_) {}
  }

  // Try aircraft model from adsbdb icao24
  if (!model && ac.icao24) {
    try {
      const mRes = await fetch(`https://api.adsbdb.com/v0/aircraft/${ac.icao24}`);
      if (mRes.ok) {
        const mData = await mRes.json();
        const info = mData?.response?.aircraft;
        if (info) {
          model = formatModel(info.type || info.aircraft_type || '');
          if (!model && info.manufacturer) model = `${info.manufacturer} ${info.type || ''}`.trim();
          // Registration can hint at private
          if (info.registered_owner && flightType === 'unknown') {
            const owner = info.registered_owner.toLowerCase();
            if (/airline|airways|air |aviation|cargo|express|freight/.test(owner)) flightType = 'commercial';
            else flightType = 'private';
          }
        }
      }
    } catch(_) {}
  }

  const enriched = { model, origin, destination, flightType, enriched: true, enrichLoading: false };
  enrichCache[ac.icao24] = enriched;
  Object.assign(ac, enriched);

  renderList();
  if (selectedIcao === ac.icao24) renderDetail();
}

function formatModel(raw) {
  if (!raw) return null;
  // Map common ICAO type codes to readable names
  const map = {
    'B738':'Boeing 737-800','B737':'Boeing 737-700','B739':'Boeing 737-900',
    'B744':'Boeing 747-400','B748':'Boeing 747-8','B752':'Boeing 757-200',
    'B763':'Boeing 767-300','B772':'Boeing 777-200','B77W':'Boeing 777-300ER',
    'B773':'Boeing 777-300','B788':'Boeing 787-8','B789':'Boeing 787-9',
    'B78X':'Boeing 787-10','B38M':'Boeing 737 MAX 8','B39M':'Boeing 737 MAX 9',
    'A319':'Airbus A319','A320':'Airbus A320','A321':'Airbus A321',
    'A20N':'Airbus A320neo','A21N':'Airbus A321neo','A318':'Airbus A318',
    'A332':'Airbus A330-200','A333':'Airbus A330-300','A339':'Airbus A330-900neo',
    'A342':'Airbus A340-200','A343':'Airbus A340-300','A345':'Airbus A340-500','A346':'Airbus A340-600',
    'A359':'Airbus A350-900','A35K':'Airbus A350-1000',
    'A380':'Airbus A380','A388':'Airbus A380-800',
    'E170':'Embraer E170','E175':'Embraer E175','E190':'Embraer E190','E195':'Embraer E195',
    'E75L':'Embraer E175-E2','E290':'Embraer E190-E2',
    'CRJ2':'Bombardier CRJ-200','CRJ7':'Bombardier CRJ-700','CRJ9':'Bombardier CRJ-900',
    'DH8D':'Bombardier Q400','AT75':'ATR 72-500','AT76':'ATR 72-600','AT45':'ATR 42-500',
    'C172':'Cessna 172','C208':'Cessna 208','C56X':'Cessna Citation','C680':'Cessna Citation Sovereign',
    'PC12':'Pilatus PC-12','TBM9':'Daher TBM 930','SR22':'Cirrus SR22',
    'GL7T':'Gulfstream G700','GL5T':'Gulfstream G550','GLEX':'Bombardier Global Express',
    'F2TH':'Dassault Falcon 2000','F900':'Dassault Falcon 900','F7X':'Dassault Falcon 7X',
    'LJ60':'Learjet 60','CL60':'Bombardier Challenger 600',
    'B06':'Bell 206','B407':'Bell 407','EC35':'Airbus H135','EC45':'Airbus H145',
    'A109':'Agusta A109','S76':'Sikorsky S-76',
    'DC10':'McDonnell Douglas DC-10','MD11':'McDonnell Douglas MD-11',
    'IL76':'Ilyushin Il-76','AN24':'Antonov An-24',
  };
  const upper = raw.toUpperCase().replace(/\s+/g,'').substring(0,4);
  return map[upper] || raw;
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('ac-list');
  if (!aircraft.length) {
    list.innerHTML = `<div class="empty">Aucun aéronef détecté<br>dans un rayon de ${RADIUS_KM} km</div>`;
    return;
  }

  list.innerHTML = aircraft.map(a => {
    const typeClass = a.flightType === 'commercial' ? 'commercial'
                    : a.flightType === 'private' ? 'private'
                    : 'unknown';
    const typeLabel = a.flightType === 'commercial' ? 'VOL COMMERCIAL'
                    : a.flightType === 'private' ? 'VOL PRIVÉ'
                    : a.flightType === 'military' ? 'MILITAIRE'
                    : 'TYPE INCONNU';

    const routeHtml = a.enrichLoading
      ? `<span class="loading">— chargement…</span>`
      : (a.origin || a.destination)
        ? `<span class="airport">${a.origin?.code || '?'}</span>
           <span class="arrow">──✈──</span>
           <span class="airport">${a.destination?.code || '?'}</span>
           ${a.origin?.city ? `<span style="color:var(--dim);font-size:0.62rem">${a.origin.city}${a.destination?.city ? ' → '+a.destination.city : ''}</span>` : ''}`
        : `<span style="color:var(--dim)">Route inconnue</span>`;

    const modelHtml = a.model
      ? `<span style="color:var(--dim);font-size:0.6rem;letter-spacing:0.06em;">${a.model}</span>`
      : (a.enrichLoading ? `<span style="color:var(--dimmer)">…</span>` : '');

    const vr = a.vertRate != null
      ? (parseFloat(a.vertRate) > 0 ? '↑' : parseFloat(a.vertRate) < 0 ? '↓' : '→') + ' ' + Math.abs(a.vertRate) + ' m/s'
      : '—';

    return `<div class="ac-card${selectedIcao === a.icao24 ? ' selected' : ''}" onclick="selectCard('${a.icao24}')">
      <div class="ac-dist-tag">${a.dist.toFixed(1)} km</div>
      <div class="ac-top">
        <div>
          <div class="ac-callsign">${a.callsign}</div>
          ${modelHtml}
        </div>
        <div class="ac-type-badge ${typeClass}">${typeLabel}</div>
      </div>
      <div class="ac-route">${routeHtml}</div>
      <div class="ac-grid">
        <div class="ac-field"><div class="lbl">ALT</div><div class="val">${a.altitude != null ? a.altitude+'m' : '—'}</div></div>
        <div class="ac-field"><div class="lbl">VITESSE</div><div class="val">${a.velocity != null ? a.velocity+'km/h' : '—'}</div></div>
        <div class="ac-field"><div class="lbl">CAP</div><div class="val">${a.heading != null ? Math.round(a.heading)+'°' : '—'}</div></div>
        <div class="ac-field"><div class="lbl">VERT.</div><div class="val">${vr}</div></div>
      </div>
    </div>`;
  }).join('');
}

function selectCard(icao) {
  selectedIcao = selectedIcao === icao ? null : icao;
  renderList();
  renderDetail();
  drawRadar();
}

function renderDetail() {
  const box = document.getElementById('detail');
  if (!selectedIcao) { box.classList.remove('open'); return; }
  const a = aircraft.find(x => x.icao24 === selectedIcao);
  if (!a) { box.classList.remove('open'); return; }

  const typeLabel = a.flightType === 'commercial' ? '✦ Vol commercial'
                  : a.flightType === 'private' ? '◆ Vol privé'
                  : a.flightType === 'military' ? '⬛ Militaire'
                  : '? Type indéterminé';
  const typeColor = a.flightType === 'commercial' ? 'var(--blue)'
                  : a.flightType === 'private' ? 'var(--red)' : 'var(--dim)';

  const routeBlock = (a.origin || a.destination) ? `
    <div class="detail-route-big">
      <div class="drt-airport">
        <div class="code">${a.origin?.code || '?'}</div>
        <div class="name">${a.origin?.city || a.origin?.name || '—'}</div>
      </div>
      <div class="drt-line"></div>
      <div class="drt-airport">
        <div class="code">${a.destination?.code || '?'}</div>
        <div class="name">${a.destination?.city || a.destination?.name || '—'}</div>
      </div>
    </div>` : `<div style="color:var(--dim);font-size:0.65rem;margin-bottom:14px;">Route non disponible</div>`;

  box.innerHTML = `
    <div class="detail-callsign">${a.callsign}</div>
    <div class="detail-model">${a.model || (a.enrichLoading ? '<span style="color:var(--dim)">Modèle en chargement…</span>' : 'Modèle non identifié')}
      &nbsp;<span style="color:${typeColor};font-size:0.65rem;">${typeLabel}</span>
    </div>
    ${routeBlock}
    <div class="detail-rows">
      <div class="dr"><span class="dk">Altitude</span><span class="dv">${a.altitude != null ? a.altitude+' m / '+Math.round(a.altitude*3.28084)+' ft' : '—'}</span></div>
      <div class="dr"><span class="dk">Vitesse</span><span class="dv">${a.velocity != null ? a.velocity+' km/h' : '—'}</span></div>
      <div class="dr"><span class="dk">Cap</span><span class="dv">${a.heading != null ? Math.round(a.heading)+'°' : '—'}</span></div>
      <div class="dr"><span class="dk">Taux vert.</span><span class="dv">${a.vertRate != null ? a.vertRate+' m/s' : '—'}</span></div>
      <div class="dr"><span class="dk">Distance</span><span class="dv">${a.dist.toFixed(2)} km</span></div>
      <div class="dr"><span class="dk">Pays enreg.</span><span class="dv">${a.country}</span></div>
      <div class="dr"><span class="dk">ICAO24</span><span class="dv">${a.icao24.toUpperCase()}</span></div>
      <div class="dr"><span class="dk">Position</span><span class="dv">${a.lat.toFixed(3)}, ${a.lon.toFixed(3)}</span></div>
    </div>
  `;
  box.classList.add('open');
}

// ─────────────────────────────────────────────
//  RADAR
// ─────────────────────────────────────────────
function showRadar() {
  document.getElementById('splash').style.display = 'none';
  const c = document.getElementById('radar');
  c.style.display = 'block';
  resizeRadar();
  if (!rafId) animateRadar();
  document.getElementById('refresh-btn').disabled = false;
}

function resizeRadar() {
  const wrap = document.getElementById('radar-wrap');
  const c = document.getElementById('radar');
  const size = Math.min(wrap.clientWidth, wrap.clientHeight) * 0.86;
  c.width = size; c.height = size;
}

function animateRadar() {
  radarAngle = (radarAngle + 0.7) % 360;
  drawRadar();
  rafId = requestAnimationFrame(animateRadar);
}

function drawRadar() {
  const c = document.getElementById('radar');
  if (!c || c.style.display === 'none') return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const cx = W/2, cy = H/2, R = W*0.46;

  ctx.clearRect(0,0,W,H);

  // BG
  const bg = ctx.createRadialGradient(cx,cy,0,cx,cy,R);
  bg.addColorStop(0,'#120e00'); bg.addColorStop(1,'#060400');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();

  // Rings + labels
  [0.25,0.5,0.75,1].forEach(f => {
    ctx.beginPath(); ctx.arc(cx,cy,R*f,0,Math.PI*2);
    ctx.strokeStyle = '#1a1300'; ctx.lineWidth = 1; ctx.stroke();
    if (f < 1) {
      ctx.fillStyle = '#2a1e00';
      ctx.font = `${W*0.021}px 'DM Mono'`;
      ctx.textAlign='left';
      ctx.fillText(`${Math.round(RADIUS_KM*f)} km`, cx+R*f+3, cy-4);
    }
  });

  // Cross
  ctx.strokeStyle = '#1a1300'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx,cy-R); ctx.lineTo(cx,cy+R); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-R,cy); ctx.lineTo(cx+R,cy); ctx.stroke();

  // Cardinals
  ctx.fillStyle = '#3d2c00';
  ctx.font = `bold ${W*0.026}px 'Orbitron'`;
  ctx.textAlign='center';
  ctx.fillText('N',cx,cy-R-8);
  ctx.fillText('S',cx,cy+R+16);
  ctx.textAlign='right'; ctx.fillText('O',cx-R-8,cy+4);
  ctx.textAlign='left';  ctx.fillText('E',cx+R+8,cy+4);
  ctx.textAlign='center';

  // Sweep
  const sweepRad = (radarAngle - 90) * Math.PI/180;
  for (let i = 0; i < 72; i++) {
    const sa = sweepRad - (i+1)*Math.PI/72;
    const ea = sweepRad - i*Math.PI/72;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,sa,ea); ctx.closePath();
    ctx.fillStyle = `rgba(255,179,71,${(1-i/72)*0.12})`;
    ctx.fill();
  }

  // Sweep line
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+R*Math.cos(sweepRad), cy+R*Math.sin(sweepRad));
  ctx.strokeStyle = 'rgba(255,179,71,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();

console.log("Aircraft sample", aircraft[0]);
  
  // Aircraft
  aircraft.forEach(a => {
    const bRad = (a.brg - 90) * Math.PI/180;
    const d = (a.dist/RADIUS_KM)*R;
    const bx = cx + d*Math.cos(bRad);
    const by = cy + d*Math.sin(bRad);
    const isSel = a.icao24 === selectedIcao;

    // Colour by type
    const col = a.flightType === 'commercial' ? '#4dc8ff'
              : a.flightType === 'private' ? '#ff4d4d'
              : isSel ? '#ffb347' : '#ffb34799';

    // Glow

    // simpler:
    ctx.beginPath(); ctx.arc(bx,by,isSel?14:9,0,Math.PI*2);
    ctx.fillStyle = isSel ? 'rgba(255,179,71,0.12)' : 'rgba(255,179,71,0.07)';
    ctx.fill();

    // Heading trail
    if (a.heading != null) {
      const hRad = (a.heading - 90)*Math.PI/180;
      ctx.beginPath(); ctx.moveTo(bx,by);
      ctx.lineTo(bx+22*Math.cos(hRad), by+22*Math.sin(hRad));
      ctx.strokeStyle = col; ctx.lineWidth=1; ctx.globalAlpha=0.5; ctx.stroke();
      ctx.globalAlpha=1;
    }

    // Blip
    ctx.beginPath(); ctx.arc(bx,by,isSel?4:2.5,0,Math.PI*2);
    ctx.fillStyle = col;
    ctx.shadowBlur=10; ctx.shadowColor=col; ctx.fill();
    ctx.shadowBlur=0;

    // Label
    ctx.font = `${W*0.02}px 'DM Mono'`;
    ctx.fillStyle = isSel ? '#ffb347' : 'rgba(255,179,71,0.7)';
    ctx.textAlign = bx > cx ? 'left' : 'right';
    ctx.fillText(a.callsign, bx > cx ? bx+7 : bx-7, by-6);
    ctx.textAlign='center';
  });

  // Clip
  ctx.save(); ctx.globalCompositeOperation='destination-in';
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
  ctx.restore();

  // Border
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,179,71,0.2)'; ctx.lineWidth=2; ctx.stroke();
}

// ─────────────────────────────────────────────
//  SCHEDULING
// ─────────────────────────────────────────────
function startFetching() {
  fetchAircraft();
  startCountdown();
  document.getElementById('cdown-wrap').style.display = 'flex';
}

function startCountdown() {
  clearInterval(cdInterval);
  clearTimeout(fetchTimeout);
  countdownVal = 30;
  updateCountdown();
  cdInterval = setInterval(() => {
    countdownVal--;
    updateCountdown();
    if (countdownVal <= 0) {
      clearInterval(cdInterval);
      fetchAircraft().then(() => startCountdown());
    }
  }, 1000);
}

function updateCountdown() {
  document.getElementById('cdown-sec').textContent = countdownVal + 's';
  document.getElementById('cdown-bar').style.width = (countdownVal/30*100) + '%';
}

function manualRefresh() {
  clearInterval(cdInterval);
  fetchAircraft().then(() => startCountdown());
}

// ─────────────────────────────────────────────
//  UI HELPERS
// ─────────────────────────────────────────────
function setPill(which, state, text) {
  const p = document.getElementById('pill-'+which);
  p.className = 'pill' + (state === 'on' ? ' on' : state === 'warn' ? ' warn' : '');
  p.innerHTML = state === 'loading'
    ? `<span class="spin"></span>${text}`
    : text;
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

window.addEventListener('resize', () => { resizeRadar(); drawRadar(); });
</script>
